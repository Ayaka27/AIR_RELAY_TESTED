[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "airrelay"
version = "1.0.0"
description = "Airborne multi-band SDR relay system for Raspberry Pi 4"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
dependencies = [
    "flask>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
radio = ["pyrtlsdr>=0.2.6", "hackrf>=0.1"]
flight = ["pymavlink>=2.4.37"]

[project.scripts]
airrelay = "airrelay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
